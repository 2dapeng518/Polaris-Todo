appId: com.polaris.todo
productName: Polaris
directories:
  buildResources: build
  output: dist
files:
  - "**/*"
  - "!src/**/*"
  - "!scripts/**/*"
  - "!build/**/*"
  - "!dist/**/*"
  - "!*.md"
  - "!screenshot*.png"
  - "!electron.vite.config.ts"
  - "!tsconfig*.json"
  - "!electron-builder.yml"
  - "!package-lock.json"
  - "!out/**/*.map"
  # 研究材料、设计参考与本地工具配置不进安装包
  - "!docs/**/*"
  - "!design-system/**/*"
  - "!.claude/**/*"
  - "!.kilo/**/*"
  - "!polaris-packaged-debug.log"
  # 字体是运行时资产，故列在 dependencies；但 Vite 已把用到的 woff2 打进
  # out/renderer/assets，整包 node_modules 再带一份会让字体体积翻倍。
  - "!node_modules/@fontsource-variable/**/*"
  # NOTICE 与 licenses 经 extraResources 放到 asar 外（resources/），用户可直接查看，
  # 满足 OFL「easily viewed」要求；故从 asar 内排除避免重复。
  - "!NOTICE"
  - "!licenses/**/*"
asarUnpack:
  - "**/*.node"
extraResources:
  - from: NOTICE
    to: NOTICE
  - from: licenses
    to: licenses
electronLanguages:
  - zh-CN
  - en-US
mac:
  icon: build/icon.icns
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  language: "2052"
  artifactName: "Polaris-Setup-${version}.${ext}"
