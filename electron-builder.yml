appId: com.polaris.todo
productName: Polaris
# 在线更新走 GitHub Releases：build:win 会产出 latest.yml + exe + blockmap，
# 发版时把三样一起传到对应 tag 的 Release 资产里，客户端靠 latest.yml 判断新版。
publish:
  provider: github
  owner: 2dapeng518
  repo: Polaris-Todo
directories:
  buildResources: build
  output: dist
files:
  - "**/*"
  - "!src/**/*"
  - "!scripts/**/*"
  - "!build/**/*"
  - "!dist/**/*"
  - "!*.md"
  - "!screenshot*.png"
  - "!electron.vite.config.ts"
  - "!tsconfig*.json"
  - "!electron-builder.yml"
  - "!package-lock.json"
  - "!out/**/*.map"
  # 研究材料、设计参考与本地工具配置不进安装包
  - "!docs/**/*"
  - "!design-system/**/*"
  - "!.claude/**/*"
  - "!.kilo/**/*"
  - "!polaris-packaged-debug.log"
  # 字体是运行时资产，故列在 dependencies；但 Vite 已把用到的 woff2 打进
  # out/renderer/assets，整包 node_modules 再带一份会让字体体积翻倍。
  - "!node_modules/@fontsource-variable/**/*"
  # NOTICE 与 licenses 经 extraResources 放到 asar 外（resources/），用户可直接查看，
  # 满足 OFL「easily viewed」要求；故从 asar 内排除避免重复。
  - "!NOTICE"
  - "!licenses/**/*"
asarUnpack:
  - "**/*.node"
extraResources:
  - from: NOTICE
    to: NOTICE
  - from: licenses
    to: licenses
electronLanguages:
  - zh-CN
  - en-US
mac:
  icon: build/icon.icns
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # 一键安装：双击直接装进当前用户目录（%LOCALAPPDATA%\Programs），
  # 不弹「为哪位用户安装 / 选择目录」向导页，装完自动运行。
  # 配合 updater.ts 的 quitAndInstall(true, true)：更新 /S 静默 + 装完拉起新版。
  # 注意：老的「所有用户」副本（Program Files）会让更新仍弹一次 UAC，
  # 需先卸载旧副本再装新包才能全程无感。
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  language: "2052"
  artifactName: "Polaris-Setup-${version}.${ext}"
